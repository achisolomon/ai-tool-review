name: Promote to production

# Cloudflare Pages builds and deploys the `production` branch through its
# GitHub app. This workflow moves `production` to main only after Tests pass,
# so the test gate holds without any Cloudflare credentials in GitHub.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Fast-forward production to the tested commit
        run: git push origin HEAD:refs/heads/production
