<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Suggestions - AI Tool Review</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reviews.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/suggest.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .suggestion-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
        }
        .btn-danger {
            background: #3a1a1a;
            color: #ce9178;
            border: 1px solid #5a2a2a;
        }
        .btn-danger:hover {
            background: #5a2a2a;
        }
        .status-badge.applied {
            background: #1a3a1a;
            color: #4ec9b0;
            border: 1px solid #2a5a2a;
        }
        .suggestion-note {
            font-size: 0.875rem;
            color: #858585;
            margin: 0.5rem 0 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-header-left">
                <a href="/" class="admin-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>AI Tool Review</span>
                </a>
                <span class="admin-divider">/</span>
                <h1>My Suggestions</h1>
            </div>
            <div class="admin-header-actions">
                <span id="user-info"></span>
                <button id="logout-btn" class="btn btn-ghost hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Sign out
                </button>
            </div>
        </header>

        <!-- Not Logged In State -->
        <div id="login-required" class="auth-state hidden">
            <!-- Sign-in card populated by auth-signin.js -->
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="auth-state">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading your suggestions...</p>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="admin-main hidden">
            <div class="review-list" id="suggestion-list">
                <!-- Suggestion cards inserted here -->
            </div>

            <div id="empty-state" class="empty-state hidden">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                <p id="empty-message">You haven't submitted any suggestions yet.</p>
                <a href="landscape.html" class="btn btn-ghost" style="margin-top:1rem;">Go to the landscape</a>
            </div>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth-signin.js"></script>
    <script src="js/data.js"></script>
    <script src="js/suggest-logic.js"></script>
    <script src="js/suggest.js"></script>
    <script>
        // Render sign-in card using the shared AuthSignIn component
        // (Required by validate:auth-pages — must call AuthSignIn.renderCard)
        (function() {
            const loginRequired = document.getElementById('login-required');
            if (loginRequired && window.AuthSignIn) {
                loginRequired.innerHTML = window.AuthSignIn.renderCard({
                    title: 'Sign in required',
                    description: 'Sign in to view and manage your submitted suggestions.'
                });
                window.AuthSignIn.initHandlers(loginRequired, function(errorMsg) {
                    const toast = document.getElementById('toast');
                    if (toast) {
                        toast.textContent = errorMsg;
                        toast.className = 'toast error';
                        toast.classList.remove('hidden');
                        setTimeout(() => toast.classList.add('hidden'), 4000);
                    }
                });
            }
        })();
    </script>
    <script src="js/my-suggestions.js"></script>
</body>
</html>
