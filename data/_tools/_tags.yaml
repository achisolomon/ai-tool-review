# Controlled vocabulary for tags
# Tags describe capabilities, NOT where a tool lives (use categories for that)
# Build fails on unknown tags - add new tags here before using them
# NOTE: Don't add tags that match category/subcategory IDs (e.g., open-source, enterprise)

