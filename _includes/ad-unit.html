<!-- Single ad unit, placed after the article content. Lives outside
     #page-content so the SPA router doesn't swap it; CSS hides it whenever the
     current #page-content is not marked .ad-eligible (e.g. after an in-app
     navigation from a review to the home search screen). -->
<div class="footer-ad">
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-7272761067250869"
        data-ad-slot="1939469484"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            (adsbygoogle = window.adsbygoogle || []).push({});
        } else {
            // Dev placeholder so the slot is visible when testing locally.
            document.currentScript.previousElementSibling.innerHTML =
                '<div style="color:#4a9eff;font-size:12px;border:2px dashed #4a9eff;height:100%;display:flex;align-items:center;justify-content:center;">Ad Placeholder</div>';
        }
    </script>
</div>
