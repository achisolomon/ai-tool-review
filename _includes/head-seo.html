{% capture seo_description %}{% if page.description %}{{ page.description }}{% else %}{{ page.name }} - AI tool for {{ page.category | replace: '-', ' ' }}. Find features, pricing, and alternatives.{% endif %}{% endcapture %}
<!-- Primary Meta Tags -->
<title>{{ page.name }} - AI Tool Review</title>
<meta name="title" content="{{ page.name }} - AI Tool Review" data-spa-head>
<meta name="description" content="{{ seo_description | strip_newlines }}" data-spa-head>
<link rel="canonical" href="{{ site.url }}/tools/{{ page.slug }}/" data-spa-head>

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" data-spa-head>
<meta property="og:url" content="{{ site.url }}/tools/{{ page.slug }}/" data-spa-head>
<meta property="og:title" content="{{ page.name }} - AI Tool Review" data-spa-head>
<meta property="og:description" content="{{ seo_description | strip_newlines }}" data-spa-head>
<meta property="og:site_name" content="AI Tool Review" data-spa-head>

<!-- Twitter -->
<meta name="twitter:card" content="summary" data-spa-head>
<meta name="twitter:url" content="{{ site.url }}/tools/{{ page.slug }}/" data-spa-head>
<meta name="twitter:title" content="{{ page.name }} - AI Tool Review" data-spa-head>
<meta name="twitter:description" content="{{ seo_description | strip_newlines }}" data-spa-head>

<!-- Robots -->
<meta name="robots" content="index, follow" data-spa-head>
