<!-- Primary Meta Tags -->
<title>{{ page.name }} - AI Tool Review</title>
<meta name="title" content="{{ page.name }} - AI Tool Review">
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.url }}/tools/{{ page.slug }}/">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}/tools/{{ page.slug }}/">
<meta property="og:title" content="{{ page.name }} - AI Tool Review">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:site_name" content="AI Tool Review">

<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:url" content="{{ site.url }}/tools/{{ page.slug }}/">
<meta name="twitter:title" content="{{ page.name }} - AI Tool Review">
<meta name="twitter:description" content="{{ page.description }}">

<!-- Robots -->
<meta name="robots" content="index, follow">
