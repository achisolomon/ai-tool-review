title: AI Tool Review
description: Find the Right AI Tool for the Job
url: "https://aitoolreview.ai"
baseurl: ""

# Jekyll collection configuration
collections_dir: data
collections:
  tools:
    output: true
    permalink: /tools/:slug/
  learn:
    output: true
    permalink: /guides/:slug/

# Default layout for tools and learn articles
defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
  - scope:
      path: ""
      type: "learn"
    values:
      layout: "learn"

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - scripts
  - vendor
  - .bundle
  # Dev/test/prototype files must not be published: AdSense treats
  # under-construction and test screens as low-value content.
  - tests
  - docs
  - supabase
  - prototypes
  - playwright-report
  - test-results
  - hero-variants.html
  - test-popstate.html
  - mobile-shot.mjs
  - build-spa-site.js
  - server.js
  - playwright.config.js
  - package.json
  - package-lock.json
  - README.md
  - CONTRIBUTING.md
  - LOCAL_DB_FIX_HANDOFF.md
  - test-plan-tags-feature.md
  - skills-lock.json
  - PRODUCT.md

