    <circle cx="660" cy="110" r="5" fill="#9cdcfe" fill-opacity="0.85"/>
    <circle cx="820" cy="180" r="4" fill="#4ec9b0" fill-opacity="0.85"/>
    <circle cx="980" cy="100" r="6" fill="#569cd6" fill-opacity="0.8"/>
    <circle cx="1100" cy="200" r="4" fill="#dcdcaa" fill-opacity="0.85"/>
