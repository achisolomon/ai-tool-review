  <!-- eyebrow -->
  <text x="600" y="255" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="24" fill="#4ec9b0"><tspan fill-opacity="0.6">// </tspan>Community-curated, for developers</text>

  <!-- headline -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#e0e0e0">Map the AI <tspan fill="#4ec9b0">landscape</tspan>.</text>
  <text x="600" y="408" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#e0e0e0">Together.</text>

  <!-- subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9d9d9d">330+ tools across 15+ categories — community-reviewed, honestly ranked.</text>

  <!-- status bar -->
  <rect x="0" y="592" width="1200" height="38" fill="#007acc"/>
  <text x="24" y="617" font-family="Consolas, Menlo, monospace" font-size="19" fill="#ffffff">community-curated</text>
  <text x="280" y="617" font-family="Consolas, Menlo, monospace" font-size="19" fill="#ffffff">330+ tools</text>
  <text x="460" y="617" font-family="Consolas, Menlo, monospace" font-size="19" fill="#ffffff">15 categories</text>
  <text x="1176" y="617" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="19" fill="#ffffff">aitoolreview</text>
